<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wiemspro Studio Controller</title>
  <style>
    :root {
      --bg-dark: #070a13;
      --card-surface: #101827;
      --card-border: #1e293b;
      --accent-cyan: #06b6d4;
      --accent-glow: rgba(6, 182, 212, 0.35);
      --success-green: #10b981;
      --danger-red: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.4);
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      padding: 16px 16px 110px 16px;
      font-family: var(--font-stack);
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
    }

    .app-viewport {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 8px;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .brand-title span { color: var(--accent-cyan); }

    .status-pill {
      font-size: 0.75rem;
      padding: 6px 14px;
      border-radius: 999px;
      background: #1e293b;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }
    .status-pill.connected {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success-green);
    }
    .status-pill.connected .status-dot {
      background: var(--success-green);
      box-shadow: 0 0 8px var(--success-green);
    }

    .card {
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .card-label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .telemetry-hub {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
    }

    .pulse-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 5px solid #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pulse-ring.active {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 35px var(--accent-glow);
      animation: pulseAnimation 2s infinite ease-in-out;
    }

    @keyframes pulseAnimation {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .pulse-status { font-size: 0.8rem; font-weight: 800; letter-spacing: 1px; color: var(--text-muted); }
    .pulse-timer { font-size: 2.1rem; font-weight: 900; margin-top: 2px; }

    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .slider-caption { font-size: 0.9rem; font-weight: 600; }
    .slider-metric { font-size: 1.1rem; font-weight: 800; color: var(--accent-cyan); }

    input[type=range] {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent-cyan);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .muscle-matrix {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .muscle-node {
      background: #090f1d;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .muscle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .muscle-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .muscle-icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--accent-cyan);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .muscle-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: #cbd5e1;
    }

    .muscle-val {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-cyan);
    }

    .fixed-action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(7, 10, 19, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      z-index: 999;
    }

    .action-container {
      width: 100%;
      max-width: 580px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      padding: 16px;
      font-size: 0.95rem;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-connect {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--accent-cyan);
      width: 100%;
    }

    .btn-start {
      background: var(--accent-cyan);
      color: #041019;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-stop {
      background: var(--danger-red);
      color: #ffffff;
      box-shadow: 0 4px 20px var(--danger-glow);
    }
  </style>
</head>
<body>

<div class="app-viewport">

  <header>
    <div class="brand-title">WIEMS<span>PRO</span> STUDIO</div>
    <div class="status-pill" id="statusPill">
      <div class="status-dot"></div>
      <span id="statusText">DÉCONNECTÉ</span>
    </div>
  </header>

  <button class="btn-connect" id="btnConnect">Lancer l'appairage Bluetooth</button>

  <div class="card">
    <div class="card-label">Moniteur de session</div>
    <div class="telemetry-hub">
      <div class="pulse-ring" id="pulseRing">
        <span class="pulse-status" id="pulseStatus">VEILLE</span>
        <span class="pulse-timer" id="pulseTimer">0 s</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Générateur d'impulsion</div>
    
    <div style="margin-bottom: 16px;">
      <div class="slider-row">
        <span class="slider-caption">Fréquence de stimulation</span>
        <span class="slider-metric"><span id="lblFreq">77</span> Hz</span>
      </div>
      <input type="range" id="rngFreq" min="10" max="100" value="77">
    </div>

    <div>
      <div class="slider-row">
        <span class="slider-caption">Master Intensité</span>
        <span class="slider-metric"><span id="lblMaster">0</span> %</span>
      </div>
      <input type="range" id="rngMaster" min="0" max="100" value="0">
    </div>
  </div>

  <div class="card">
    <div class="card-label">Groupes musculaires cibles (10 canaux)</div>
    <div class="muscle-matrix" id="muscleMatrix"></div>
  </div>

</div>

<div class="fixed-action-bar">
  <div class="action-container">
    <button class="btn-start" id="btnStart" disabled>Armer & Lancer</button>
    <button class="btn-stop" id="btnStop" disabled>Stop d'urgence</button>
  </div>
</div>

<script>
  const SERVICE_UUID    = "7764d8fe-c6a9-11e4-8731-1681e6b88ec1";
  const CHAR_PROG_DUR   = "7764db60-c6a9-11e4-8731-1681e6b88ec1";
  const CHAR_WORK_DUR   = "7764dcaa-c6a9-11e4-8731-1681e6b88ec1";
  const CHAR_REST_DUR   = "7764e038-c6a9-11e4-8731-1681e6b88ec1";
  const CHAR_PULSE_POS  = "7764e556-c6a9-11e4-8731-1681e6b88ec1";
  const CHAR_PULSE_NEUT = "7764e678-c6a9-11e4-8731-1681e6b88ec1";
  const CHAR_PULSE_NEG  = "7764e79a-c6a9-11e4-8731-1681e6b88ec1";
  const CHAR_RAMP_UP    = "7764dde0-c6a9-11e4-8731-1681e6b88ec1";
  const CHAR_RAMP_DOWN  = "7764df0c-c6a9-11e4-8731-1681e6b88ec1";
  const CHAR_FREQ       = "7764e8bc-c6a9-11e4-8731-1681e6b88ec1";
  const CHAR_POWER      = "966e06c6-c717-11e4-8731-1681e6b88ec1";
  const CHAR_STARTSTOP  = "7764eda8-c6a9-11e4-8731-1681e6b88ec1";
  const CHAR_EXTRA1     = "776439af-c717-11e4-8731-1681e6b88ec1";

  const CALIBRATED_PULSE = new Uint8Array([0x76, 0x76, 0x76, 0x64, 0x6D, 0x6D, 0x64, 0x52, 0x76, 0x52]);
  const EXTRA1_PAYLOAD   = new Uint8Array([0x15, 0x4D, 0x2D, 0x19, 0x00, 0x00, 0x7E, 0x05, 0x00, 0x17]);

  const MUSCLE_DATA = [
    { name: "Cuisses", svg: `<path d="M7 2v20M17 2v20M7 12h10"/>` },
    { name: "Ischios", svg: `<path d="M8 3l3 18M16 3l-3 18"/>` },
    { name: "Fessiers", svg: `<circle cx="8" cy="12" r="5"/><circle cx="16" cy="12" r="5"/>` },
    { name: "Lombaires", svg: `<path d="M12 2v20M6 8h12M7 16h10"/>` },
    { name: "Dorsaux", svg: `<path d="M4 6l8 4 8-4M4 18l8-4 8 4"/>` },
    { name: "Trapèzes", svg: `<path d="M3 18L12 4l9 14H3z"/>` },
    { name: "Abdominaux", svg: `<rect x="5" y="4" width="14" height="16" rx="2"/><line x1="5" y1="9" x2="19" y2="9"/><line x1="5" y1="14" x2="19" y2="14"/><line x1="12" y1="4" x2="12" y2="20"/>` },
    { name: "Pectoraux", svg: `<path d="M4 10c4-4 12-4 16 0M4 14c4 4 12 4 16 0"/>` },
    { name: "Bras", svg: `<rect x="6" y="7" width="12" height="10" rx="3"/><path d="M2 12h4M18 12h4"/>` },
    { name: "Extra 1", svg: `<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>` }
  ];

  let device, server, service;
  let charProgDur, charWorkDur, charRestDur, charPulsePos, charPulseNeut, charPulseNeg;
  let charRampUp, charRampDown, charFreq, charPower, charStartStop, charExtra1;

  let isStimulating = false;
  let timerInterval = null;
  let elapsedSeconds = 0;

  const matrixContainer = document.getElementById("muscleMatrix");
  MUSCLE_DATA.forEach((m, idx) => {
    const node = document.createElement("div");
    node.className = "muscle-node";
    node.innerHTML = `
      <div class="muscle-header">
        <div class="muscle-title-wrap">
          <svg class="muscle-icon" viewBox="0 0 24 24">${m.svg}</svg>
          <span class="muscle-name">${m.name}</span>
        </div>
        <span class="muscle-val" id="valCh${idx}">0%</span>
      </div>
      <input type="range" id="ch${idx}" min="0" max="100" value="0">
    `;
    matrixContainer.appendChild(node);
  });

  const rngFreq = document.getElementById("rngFreq");
  const lblFreq = document.getElementById("lblFreq");
  const rngMaster = document.getElementById("rngMaster");
  const lblMaster = document.getElementById("lblMaster");

  rngFreq.oninput = () => lblFreq.textContent = rngFreq.value;

  rngMaster.oninput = () => {
    const val = rngMaster.value;
    lblMaster.textContent = val;
    for (let i = 0; i < 10; i++) {
      document.getElementById(`ch${i}`).value = val;
      document.getElementById(`valCh${i}`).textContent = val + "%";
    }
    if (isStimulating) pushIntensity();
  };

  for (let i = 0; i < 10; i++) {
    const s = document.getElementById(`ch${i}`);
    const v = document.getElementById(`valCh${i}`);
    s.oninput = () => {
      v.textContent = s.value + "%";
      if (isStimulating) pushIntensity();
    };
  }

  const btnConnect = document.getElementById("btnConnect");
  const statusPill = document.getElementById("statusPill");
  const statusText = document.getElementById("statusText");
  const btnStart = document.getElementById("btnStart");
  const btnStop = document.getElementById("btnStop");
  const pulseRing = document.getElementById("pulseRing");
  const pulseStatus = document.getElementById("pulseStatus");
  const pulseTimer = document.getElementById("pulseTimer");

  const delay = ms => new Promise(res => setTimeout(res, ms));

  btnConnect.onclick = async () => {
    try {
      statusText.textContent = "SCAN...";
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: "WIEMS" }],
        optionalServices: [SERVICE_UUID]
      });

      device.addEventListener('gattserverdisconnected', onDisconnected);

      statusText.textContent = "CONNEXION...";
      server = await device.gatt.connect();

      service = await server.getPrimaryService(SERVICE_UUID);
      
      charProgDur   = await service.getCharacteristic(CHAR_PROG_DUR);
      charWorkDur   = await service.getCharacteristic(CHAR_WORK_DUR);
      charRestDur   = await service.getCharacteristic(CHAR_REST_DUR);
      charPulsePos  = await service.getCharacteristic(CHAR_PULSE_POS);
      charPulseNeut = await service.getCharacteristic(CHAR_PULSE_NEUT);
      charPulseNeg  = await service.getCharacteristic(CHAR_PULSE_NEG);
      charRampUp    = await service.getCharacteristic(CHAR_RAMP_UP);
      charRampDown  = await service.getCharacteristic(CHAR_RAMP_DOWN);
      charFreq      = await service.getCharacteristic(CHAR_FREQ);
      charPower     = await service.getCharacteristic(CHAR_POWER);
      charStartStop = await service.getCharacteristic(CHAR_STARTSTOP);
      charExtra1    = await service.getCharacteristic(CHAR_EXTRA1);

      statusPill.classList.add("connected");
      statusText.textContent = "CONNECTÉ";
      btnConnect.style.display = "none";
      btnStart.disabled = false;
      btnStop.disabled = false;

    } catch (e) {
      console.error(e);
      alert("Erreur de connexion : " + e.message);
      statusText.textContent = "ERREUR";
      statusPill.classList.remove("connected");
    }
  };

  function onDisconnected() {
    emergencyShutdown();
    statusPill.classList.remove("connected");
    statusText.textContent = "DÉCONNECTÉ";
    btnConnect.style.display = "block";
    btnStart.disabled = true;
    btnStop.disabled = true;
  }

  async function pushIntensity() {
    if (!charPower) return;
    const buf = new Uint8Array(10);
    for (let i = 0; i < 10; i++) {
      buf[i] = parseInt(document.getElementById(`ch${i}`).value, 10);
    }
    await charPower.writeValue(buf);
  }

  btnStart.onclick = async () => {
    try {
      pulseStatus.textContent = "INITIALISATION...";
      btnStart.disabled = true;

      // 1. Durée totale de la séance : 20 min (1200 s = 0x04B0)
      await charProgDur.writeValue(new Uint8Array([0x04, 0xB0]));
      await delay(40);

      // 2. Cycle travail (45) / repos (25)
      await charWorkDur.writeValue(new Uint8Array([0x00, 0x2D]));
      await delay(40);
      await charRestDur.writeValue(new Uint8Array([0x00, 0x19]));
      await delay(40);

      // 3. Forme d'onde complète : Positive, Neutre (0), Négative (égale à Positive)
      await charPulsePos.writeValue(CALIBRATED_PULSE);
      await delay(40);
      await charPulseNeut.writeValue(new Uint8Array(10).fill(0x00));
      await delay(40);
      await charPulseNeg.writeValue(CALIBRATED_PULSE);
      await delay(40);

      // 4. Rampes 10 ms
      const rampBuf = new Uint8Array(10).fill(0x0A);
      await charRampUp.writeValue(rampBuf);
      await delay(40);
      await charRampDown.writeValue(rampBuf);
      await delay(40);

      // 5. Fréquence 77 Hz injectée sur chaque canal
      const freqVal = parseInt(rngFreq.value || 77, 10);
      const freqBuf = new Uint8Array([0x00, freqVal, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xA5, 0xC1]);
      await charFreq.writeValue(freqBuf);
      await delay(40);

      // 6. Paquet maître de synchronisation
      await charExtra1.writeValue(EXTRA1_PAYLOAD);
      await delay(40);

      // 7. Intensités initiales
      await pushIntensity();
      await delay(40);

      // 8. Ordre de marche Start (0x01)
      await charStartStop.writeValue(new Uint8Array([0x01]));

      isStimulating = true;
      pulseRing.classList.add("active");
      pulseStatus.textContent = "STIMULATION";

      elapsedSeconds = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        elapsedSeconds++;
        pulseTimer.textContent = elapsedSeconds + " s";
      }, 1000);

    } catch (e) {
      console.error(e);
      alert("Erreur armement : " + e.message);
      emergencyShutdown();
    }
  };

  btnStop.onclick = emergencyShutdown;

  async function emergencyShutdown() {
    // 1. Réinitialisation visuelle immédiate prioritaire
    isStimulating = false;
    clearInterval(timerInterval);
    pulseRing.classList.remove("active");
    pulseStatus.textContent = "VEILLE";
    pulseTimer.textContent = "0 s";
    btnStart.disabled = false;

    // 2. Coupure matérielle Bluetooth
    try {
      if (charStartStop) {
        await charStartStop.writeValue(new Uint8Array([0x00]));
      }
      if (charPower) {
        await charPower.writeValue(new Uint8Array(10).fill(0));
      }
    } catch (e) {
      console.warn("Échec ordre de coupure matérielle :", e);
    }
  }
</script>

</body>
</html>
